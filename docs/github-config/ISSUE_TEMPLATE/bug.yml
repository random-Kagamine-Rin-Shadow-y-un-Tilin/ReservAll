name: Bug
description: Reportar un error
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo
      options: [backend, web-negocio, movil-cliente, movil-negocio]
    validations:
      required: true
