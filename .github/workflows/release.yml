name: Release

# Se ejecuta cuando semantic-release publica un GitHub Release. También se
# puede disparar a mano para generar los artefactos sin publicar versión.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: APK (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [movil-cliente, movil-negocio]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar APK contra el backend desplegado
        run: |
          EXTRA=""
          if [ -n "$API_KEY" ]; then EXTRA="--dart-define=API_KEY=$API_KEY"; fi
          flutter build apk --release --dart-define=API_URL="$API_URL" $EXTRA
        env:
          API_URL: ${{ vars.API_URL || 'https://reservall.onrender.com' }}
          API_KEY: ${{ secrets.API_KEY }}
      - name: Renombrar APK
        run: mv build/app/outputs/flutter-apk/app-release.apk ../${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}.apk

  build-web:
    name: Web negocio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-negocio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-negocio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://reservall.onrender.com/api/v1' }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      - run: cd dist && zip -r ../../web-negocio-dist.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-negocio-dist
          path: web-negocio-dist.zip

  publish:
    needs: [build-apk, build-web]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Adjuntar artefactos al Release creado por semantic-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
          generate_release_notes: false

  notify-slack:
    needs: [build-apk, build-web, publish]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Avisar resultado en Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ contains(needs.*.result, 'failure') && ':warning: Release con problemas' || ':rocket: Artefactos listos' }}: *${{ github.event.release.tag_name || github.ref_name }}* de ${{ github.repository }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver ejecución>"
