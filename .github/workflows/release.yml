name: Release

# Se ejecuta al crear un tag tipo v1.0.0 (git tag v1.0.0 && git push origin v1.0.0)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: APK (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [movil-cliente, movil-negocio]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Renombrar APK
        run: mv build/app/outputs/flutter-apk/app-release.apk ../${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}.apk

  build-web:
    name: Web negocio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-negocio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-negocio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cd dist && zip -r ../../web-negocio-dist.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-negocio-dist
          path: web-negocio-dist.zip

  publish:
    needs: [build-apk, build-web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  notify-slack:
    needs: [build-apk, build-web, publish]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Avisar resultado en Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ needs.publish.result == 'success' && ':rocket: Release publicado' || ':warning: Release con problemas' }}: *${{ github.ref_name }}* de ${{ github.repository }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver ejecución>"
